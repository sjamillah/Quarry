<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3C1518">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<title>Quarry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Quarry turns any CSV into findings, SQL answers, charts and a trained prediction model, entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a dark slate rail (brand, dataset, sections) beside one working column; on phones the rail becomes a top bar and a bottom tab bar. */
:root{
  /* Palette: Rich Mahogany #3C1518 (rail), Dark Garnet #69140E, Rust Brown #A44200 (accent), Bronze #D58936, Canary Yellow #FFF94F (highlight). */
  --paper:#FBF7F3; --surface:#FFFFFF; --sunk:#F4ECE5; --ink:#2B1113; --ink-2:#5F4644; --ink-3:#957C76; --line:#EBDFD6;
  --accent:#A44200; --accent-ink:#FFFFFF; --accent-soft:#FBE7D4; --hl:#FFF94F;
  --rail:#3C1518; --rail-2:#52201F; --rail-ink:#FBEFE6; --rail-dim:#C9A196; --rail-hl:#FFF94F;
  --pos:#2E7A58; --neg:#B3261E; --warn:#B8661A; --good-soft:#DDF0E5; --warn-soft:#FBEBD6; --neg-soft:#F9E0DC;
  --t-num:#A44200; --t-cat:#8A5D00; --t-date:#2E7A58; --t-bool:#69140E; --t-text:#8C756F;
  --c1:#A44200; --c2:#3D6B8A; --c3:#D58936; --c4:#69140E; --c5:#2E7A58; --c6:#8A6AAE;
  --shadow:0 1px 2px rgb(60 21 24 / .05), 0 10px 26px -16px rgb(60 21 24 / .28);
  --f-ui:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  --lg1:#FFF94F; --lg2:#D58936; --lg3:#A44200; --lg4:#69140E; --lg5:#3C1518; --lgA:#A44200; --lgB:#FFF94F; --hlp:88%;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#160A0B; --surface:#221112; --sunk:#2D1718; --ink:#F8ECE4; --ink-2:#D3B8AD; --ink-3:#9D8077; --line:#3D2325;
  --accent:#E09449; --accent-ink:#1E0C0D; --accent-soft:#40220F; --hl:#FFF94F;
  --rail:#0E0506; --rail-2:#22100F; --rail-ink:#F8ECE4; --rail-dim:#A88378; --rail-hl:#FFF94F;
  --pos:#5DC293; --neg:#F07468; --warn:#EBA24D; --good-soft:#15362A; --warn-soft:#3B2711; --neg-soft:#40191A;
  --t-num:#E09449; --t-cat:#F0CC5C; --t-date:#5DC293; --t-bool:#F08A7E; --t-text:#A8908A;
  --c1:#E09449; --c2:#7DB2D8; --c3:#F2E35A; --c4:#F07468; --c5:#5DC293; --c6:#C3A3E8;
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 12px 30px -16px rgb(0 0 0 / .75); --lg1:#FFF94F; --lg2:#E09449; --lg3:#C25A12; --lg4:#A44200; --lg5:#7E2410; --lgA:#E09449; --lgB:#FFF94F; --hlp:38%; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#160A0B; --surface:#221112; --sunk:#2D1718; --ink:#F8ECE4; --ink-2:#D3B8AD; --ink-3:#9D8077; --line:#3D2325;
  --accent:#E09449; --accent-ink:#1E0C0D; --accent-soft:#40220F; --hl:#FFF94F;
  --rail:#0E0506; --rail-2:#22100F; --rail-ink:#F8ECE4; --rail-dim:#A88378; --rail-hl:#FFF94F;
  --pos:#5DC293; --neg:#F07468; --warn:#EBA24D; --good-soft:#15362A; --warn-soft:#3B2711; --neg-soft:#40191A;
  --t-num:#E09449; --t-cat:#F0CC5C; --t-date:#5DC293; --t-bool:#F08A7E; --t-text:#A8908A;
  --c1:#E09449; --c2:#7DB2D8; --c3:#F2E35A; --c4:#F07468; --c5:#5DC293; --c6:#C3A3E8;
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 12px 30px -16px rgb(0 0 0 / .75); --lg1:#FFF94F; --lg2:#E09449; --lg3:#C25A12; --lg4:#A44200; --lg5:#7E2410; --lgA:#E09449; --lgB:#FFF94F; --hlp:38%; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper); color:var(--ink); font:400 15px/1.55 var(--f-ui); -webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
h1,h2,h3{margin:0; text-wrap:balance; letter-spacing:-.015em}
.mono,.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px/1 var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}

/* shell */
.app{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; background:linear-gradient(to right, var(--rail) 248px, transparent 248px)}
.rail{--lg2:#E09449; --lg3:#C25A12; --lg4:#A44200; --lg5:#7E2410; --lgA:#E09449; position:sticky; top:0; height:100vh; color:var(--rail-ink); display:flex; flex-direction:column; gap:22px; overflow-y:auto;
  padding-block:24px 20px; padding-left:max(18px, env(safe-area-inset-left,0px)); padding-right:18px; background:var(--rail)}
.brand{display:flex; align-items:center; gap:11px; text-decoration:none; color:inherit}
.brand svg{width:36px; height:36px; flex:none}
.brand b{font:800 23px/1 var(--f-ui); letter-spacing:-.035em}
.brand small{display:block; font:400 10.5px/1.2 var(--f-mono); color:var(--rail-dim); letter-spacing:.05em; margin-top:4px}
.dscard{background:var(--rail-2); border-radius:12px; padding:12px 13px; display:flex; flex-direction:column; gap:6px}
.dscard .eyebrow{color:var(--rail-dim)}
.dscard b{font-weight:600; font-size:14px; overflow-wrap:anywhere}
.dscard span.mono{font-size:11.5px; color:var(--rail-dim)}
.dscard a{font-size:12.5px; color:var(--rail-hl); text-decoration:none; font-weight:500}
.tabs{display:flex; flex-direction:column; gap:3px}
.tab{display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:10px; color:var(--rail-dim); text-decoration:none; font-weight:500; font-size:14.5px; transition:background .15s,color .15s}
.tab svg{width:18px; height:18px; flex:none}
.tab:hover{color:var(--rail-ink); background:rgb(255 255 255 / .05)}
.tab[aria-current="page"]{color:var(--rail-ink); background:rgb(255 249 79 / .10); box-shadow:inset 3px 0 0 var(--rail-hl)}
.tab[aria-current="page"] svg{color:var(--rail-hl)}
.tab.disabled{opacity:.4; pointer-events:none}
.rail-foot{margin-top:auto; display:flex; flex-direction:column; gap:12px; font-size:12.5px; color:var(--rail-dim)}
.rail-foot a{color:var(--rail-ink); text-decoration:none; border-bottom:1px solid rgb(255 255 255 / .22)}
.theme-btn{display:inline-flex; align-items:center; gap:8px; background:rgb(255 255 255 / .06); border:1px solid rgb(255 255 255 / .1); color:var(--rail-ink);
  padding:6px 11px; border-radius:999px; cursor:pointer; font-size:12.5px; align-self:flex-start}
.theme-btn svg{width:15px; height:15px}
.main{min-width:0; padding-block:32px 64px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.wrap{max-width:1120px; margin:0 auto; padding-inline:clamp(0px,2vw,24px)}
.vhead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px}
.vhead h1{font-size:clamp(26px,3.6vw,38px); font-weight:700; line-height:1.08; margin-top:6px}
.vhead p{margin:8px 0 0; color:var(--ink-2); max-width:66ch}

/* common */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.panel{padding:20px 22px; min-width:0}
.panel > h2{font-size:16.5px; font-weight:650; margin-bottom:4px}
.hint{font-size:13.5px; color:var(--ink-3); margin:0 0 14px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:9px 15px; border-radius:10px; cursor:pointer; font-weight:500; font-size:14px; transition:transform .08s, border-color .15s, background .15s; text-decoration:none; white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px; height:16px}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.5; cursor:not-allowed; filter:none}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk); color:var(--ink)}
.btn.sm{padding:6px 10px; font-size:13px; border-radius:8px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:12.5px; font-weight:500; background:var(--sunk); color:var(--ink-2); white-space:nowrap}
.type{display:inline-flex; align-items:center; gap:5px; font:600 10.5px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; padding:4px 7px; border-radius:6px;
  color:var(--tc); background:color-mix(in srgb, var(--tc) 13%, transparent)}
.type.number,.type.integer{--tc:var(--t-num)} .type.category{--tc:var(--t-cat)} .type.date{--tc:var(--t-date)} .type.boolean{--tc:var(--t-bool)} .type.text{--tc:var(--t-text)}
.flag{font:500 10.5px var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); border:1px solid var(--line); padding:2px 6px; border-radius:6px}
.sel,.inp{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px; min-width:0}
label.field{display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--ink-3); font-weight:500; min-width:0}
.grid2{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:18px; margin-bottom:18px}
.stack{display:flex; flex-direction:column; gap:18px}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}
.muted{color:var(--ink-3); font-size:13.5px; margin:0}
.loading{display:flex; align-items:center; gap:12px; padding:40px; justify-content:center; color:var(--ink-2)}
.spin{width:20px; height:20px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--accent); animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= landing ================= */
body.home .app{display:none}
.landing{display:none}
body.home .landing{display:block}
.lw{max-width:1200px; margin:0 auto; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px))}
.lnav{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:color-mix(in srgb, var(--paper) 84%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid transparent; transition:border-color .2s}
.lnav.scrolled{border-bottom-color:var(--line)}
.lnav .lw{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:14px}
.lbrand{display:inline-flex; align-items:center; gap:10px; font:800 25px/1 var(--f-ui); letter-spacing:-.05em; color:var(--ink); text-decoration:none}
.lbrand svg{width:34px; height:34px}
.llinks{display:flex; gap:2px; align-items:center}
.lk{background:none; border:0; padding:8px 12px; border-radius:8px; color:var(--ink-2); cursor:pointer; font-weight:500; font-size:14.5px}
.lk:hover{color:var(--ink); background:var(--sunk)}
.lk.ic{display:inline-grid; place-items:center; width:38px; height:38px; padding:0}
.lk.ic svg{width:18px; height:18px}
.btn.lg{padding:14px 22px; font-size:16px; border-radius:12px}
.hmark{background:linear-gradient(transparent 62%, color-mix(in srgb, var(--hl) var(--hlp), transparent) 62%, color-mix(in srgb, var(--hl) var(--hlp), transparent) 92%, transparent 92%); padding-inline:.04em}

.hero2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.02fr); gap:clamp(28px,5vw,64px); align-items:center; padding-block:clamp(28px,5vw,56px) clamp(48px,7vw,88px)}
.hero2 h1{font-size:clamp(42px,6.6vw,88px); font-weight:800; line-height:.94; letter-spacing:-.055em; margin-top:16px}
.lede{font-size:clamp(17px,1.55vw,20px); line-height:1.55; color:var(--ink-2); max-width:52ch; margin:24px 0 32px}
.cta-row{display:flex; gap:12px; flex-wrap:wrap}
.proof{display:flex; gap:clamp(18px,3vw,36px); flex-wrap:wrap; margin-top:40px; padding-top:22px; border-top:1px solid var(--line)}
.proof div{font:500 11px/1.3 var(--f-mono); color:var(--ink-3); text-transform:uppercase; letter-spacing:.1em}
.proof b{display:block; font:800 30px/1 var(--f-ui); color:var(--ink); letter-spacing:-.04em; text-transform:none; margin-bottom:6px}

.photo{position:relative; border-radius:22px; overflow:hidden; isolation:isolate; max-width:100%;
  background:linear-gradient(var(--ang,172deg), #FFF94F 0 13%, #D58936 13% 30%, #A44200 30% 52%, #69140E 52% 72%, #3C1518 72% 100%)}
.photo::after{content:""; position:absolute; inset:0; z-index:-1; background:repeating-linear-gradient(var(--ang,172deg), transparent 0 7px, rgb(0 0 0 / .05) 7px 8px)}
.photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.photo.noimg img{display:none}
.photo .pcredit{position:absolute; right:10px; top:10px; font:500 10.5px var(--f-mono); color:#fff; background:rgb(20 6 7 / .45); padding:4px 8px; border-radius:6px; text-decoration:none; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.photo.noimg .pcredit{display:none}
.hero-photo{aspect-ratio:4/4.6}
.core{position:absolute; left:16px; bottom:16px; right:16px; max-width:360px; padding:16px 18px; border-radius:16px;
  background:color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:0 18px 40px -18px rgb(20 6 7 / .6); color:var(--ink)}
.core .eyebrow{display:block; margin-bottom:10px}
.core .plan{margin:0 0 10px}
.core p{margin:0; font-size:13.5px; color:var(--ink-2)}
.core p b{color:var(--ink); font-family:var(--f-mono); font-weight:600}

.shead{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:34px}
.shead h2{font-size:clamp(30px,4.4vw,54px); font-weight:800; letter-spacing:-.045em; line-height:1; margin-top:12px; max-width:16ch}
.shead p{margin:0; color:var(--ink-2); max-width:44ch; font-size:16.5px}

.strata{padding-top:clamp(56px,8vw,100px)}
.layer{position:relative; background:var(--lc); color:var(--lt); margin-top:-18px; padding-block:52px 40px; clip-path:polygon(0 18px, 100% 0, 100% 100%, 0 100%)}
.layer:nth-child(even){clip-path:polygon(0 0, 100% 18px, 100% 100%, 0 100%)}
.layer:first-child{margin-top:0}
.layer .lw{display:grid; grid-template-columns:150px minmax(0,1fr) minmax(0,1fr); gap:clamp(18px,3vw,40px); align-items:center}
.depth{font:600 13px/1.4 var(--f-mono); letter-spacing:.06em; opacity:.85}
.depth b{display:block; font:800 34px/1 var(--f-ui); letter-spacing:-.04em; opacity:1; margin-bottom:6px}
.layer h3{font-size:clamp(22px,2.4vw,30px); font-weight:750; letter-spacing:-.03em; margin-bottom:8px}
.layer p{margin:0; font-size:15.5px; line-height:1.55; opacity:.88; max-width:48ch}
.artefact{font:500 12.5px/1.7 var(--f-mono); padding:14px 16px; border-radius:12px; background:var(--la); border:1px solid color-mix(in srgb, currentColor 18%, transparent); overflow-x:auto; white-space:pre; min-width:0}
.artefact i{font-style:normal; opacity:.6}
.artefact em{font-style:normal; color:var(--le)}
.l1{--lc:#F6E5D3; --lt:#2B1113; --la:rgb(255 255 255 / .55); --le:#A44200}
.l2{--lc:#E7B07A; --lt:#2B1113; --la:rgb(255 255 255 / .32); --le:#69140E}
.l3{--lc:#A44200; --lt:#FFF4EA; --la:rgb(0 0 0 / .16); --le:#FFF94F}
.l4{--lc:#69140E; --lt:#FBEFE6; --la:rgb(0 0 0 / .2); --le:#FFF94F}
.l5{--lc:#3C1518; --lt:#FBEFE6; --la:rgb(255 255 255 / .06); --le:#FFF94F; padding-block:60px 72px}
.l5 h3{font-size:clamp(26px,3.2vw,40px)}
.l5 .gem{width:54px; height:54px}

.craft{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:clamp(28px,5vw,64px); align-items:center; padding-block:clamp(64px,9vw,120px)}
.craft .photo{aspect-ratio:4/5; --ang:180deg}
.facts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px 28px; margin:28px 0}
.facts div{border-top:2px solid var(--ink); padding-top:12px}
.facts b{display:block; font:800 36px/1 var(--f-ui); letter-spacing:-.04em; margin-bottom:6px}
.facts span{font-size:14px; color:var(--ink-2)}
.code{font:400 13px/1.7 var(--f-mono); background:var(--rail); color:#F4E6DC; border-radius:14px; padding:18px 20px; overflow-x:auto; white-space:pre}
.code .k{color:#E09449} .code .s{color:#FFF94F} .code .c{color:#A88378}

.lsamples{padding-bottom:clamp(64px,9vw,120px)}
.scards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px}
.scard{display:flex; flex-direction:column; text-align:left; padding:0; overflow:hidden; cursor:pointer; border-radius:18px; transition:transform .2s, box-shadow .2s; color:var(--ink)}
.scard:hover{transform:translateY(-4px)}
.scard .photo{border-radius:0; aspect-ratio:16/11}
.scard .body{padding:18px 20px 20px; display:flex; flex-direction:column; gap:8px; flex:1}
.scard h3{font-size:19px; letter-spacing:-.02em}
.scard p{margin:0; font-size:14px; color:var(--ink-2); flex:1}
.scard .go{font-weight:600; color:var(--accent); font-size:14px; margin-top:6px}

.bring{margin-bottom:clamp(48px,7vw,90px); border-radius:28px; background:var(--rail); color:#FBEFE6; padding:clamp(28px,5vw,64px); display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:32px; align-items:center; position:relative; overflow:hidden}
.bring h2{font-size:clamp(32px,4.6vw,58px); font-weight:800; letter-spacing:-.05em; line-height:.98}
.bring p{color:#D9BBAE; font-size:16.5px; max-width:42ch; margin:16px 0 0}
.bdrop{border:2px dashed rgb(255 249 79 / .45); border-radius:20px; padding:34px 24px; text-align:center; display:flex; flex-direction:column; gap:12px; align-items:center; transition:background .15s, border-color .15s}
.bdrop.over{background:rgb(255 249 79 / .08); border-color:#FFF94F}
.bdrop svg{width:40px; height:40px; color:#FFF94F}
.bdrop b{font-size:18px}
.bdrop span{color:#C9A196; font-size:13.5px}
.btn.canary{background:#FFF94F; color:#3C1518; border-color:transparent; font-weight:700}
.btn.canary:hover{filter:brightness(.96)}
.btn.outline-light{background:transparent; color:#FBEFE6; border-color:rgb(251 239 230 / .35)}
.btn.outline-light:hover{border-color:#FBEFE6}

.lfoot{border-top:1px solid var(--line); padding-block:28px 40px; font-size:13.5px; color:var(--ink-3)}
.lfoot .lw{display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; align-items:flex-start}
.lfoot a{color:var(--ink-2)}
.lfoot p{margin:6px 0 0; max-width:62ch}

@media (max-width:980px){
  .hero2,.craft,.bring{grid-template-columns:minmax(0,1fr)}
  .hero-photo{aspect-ratio:4/3.4}
  .craft .photo{aspect-ratio:16/10}
  .layer .lw{grid-template-columns:minmax(0,1fr)}
  .scards{grid-template-columns:minmax(0,1fr)}
  .llinks .lk.hide-sm{display:none}
}
@media (max-width:520px){ .facts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .facts b{font-size:28px} .core{left:10px; right:10px; bottom:10px; padding:12px 14px} .core .plan{font-size:11px} .hero-photo{aspect-ratio:4/4.4} }

/* open */
.hero{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:28px; align-items:center; margin-bottom:28px}
.hero h1{font-size:clamp(32px,5vw,54px); font-weight:800; line-height:1.02; letter-spacing:-.04em}
.hero h1 em{font-style:normal; color:var(--ink); background:linear-gradient(transparent 58%, color-mix(in srgb, var(--hl) 85%, transparent) 58%, color-mix(in srgb, var(--hl) 85%, transparent) 92%, transparent 92%); padding-inline:2px}
.hero p{font-size:17px; color:var(--ink-2); margin:14px 0 0; max-width:52ch}
.drop{border:2px dashed var(--line); border-radius:18px; padding:30px 24px; text-align:center; background:var(--surface); transition:border-color .15s, background .15s; display:flex; flex-direction:column; align-items:center; gap:10px}
.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.drop svg.big{width:44px; height:44px; color:var(--accent)}
.drop b{font-size:17px}
.drop .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.paste{width:100%; min-height:120px; border:1px solid var(--line); border-radius:10px; background:var(--paper); padding:10px; font:400 12.5px/1.5 var(--f-mono); resize:vertical}
.samples{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:28px}
.sample{padding:18px; display:flex; flex-direction:column; gap:8px; cursor:pointer; text-align:left; transition:border-color .15s, transform .15s}
.sample:hover{border-color:var(--accent); transform:translateY(-2px)}
.sample h3{font-size:16.5px}
.sample p{margin:0; font-size:13.5px; color:var(--ink-2); flex:1}
.sample .meta{display:flex; gap:6px; flex-wrap:wrap}
.built{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:24px}
.built .card{padding:18px}
.built h3{font-size:15px; margin:10px 0 6px}
.built p{margin:0; font-size:13.5px; color:var(--ink-2)}
.built svg{width:22px; height:22px; color:var(--accent)}
.credit{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:20px 22px}
.credit p{margin:4px 0 0; font-size:16px}
.credit .links{display:flex; gap:8px; flex-wrap:wrap}
.err{padding:12px 14px; border-radius:10px; background:var(--neg-soft); color:var(--ink); font-size:14px; margin-top:12px; text-align:left}

/* overview */
.kpis{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:18px}
.kpi{padding:15px 17px}
.kpi .eyebrow{display:block; margin-bottom:9px}
.kpi b{font:700 28px/1 var(--f-ui); letter-spacing:-.03em; display:block}
.kpi small{display:block; margin-top:6px; font-size:12.5px; color:var(--ink-3)}
.findings{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.findings li{display:grid; grid-template-columns:26px minmax(0,1fr); gap:10px; align-items:start; padding:10px 12px; border-radius:10px; background:var(--sunk); font-size:14px}
.findings li .ic{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; font:700 13px var(--f-mono)}
.findings li.good .ic{background:var(--good-soft); color:var(--pos)}
.findings li.warn .ic{background:var(--warn-soft); color:var(--warn)}
.findings li.info .ic{background:var(--accent-soft); color:var(--accent)}
.findings code,.colref{font:500 12.5px var(--f-mono); background:var(--surface); border:1px solid var(--line); padding:1px 5px; border-radius:5px; color:var(--ink); text-decoration:none; cursor:pointer}
.chart text{fill:var(--ink-3); font:500 10.5px var(--f-mono)}
.chart .grid{stroke:var(--line)}
.chart .axis{stroke:var(--ink-3)}
.chart .lbl{fill:var(--ink-2)}
.corr text.v{font:600 10px var(--f-mono)}
table.data{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
table.data th{position:sticky; top:0; background:var(--sunk); text-align:left; font:600 12px var(--f-mono); color:var(--ink-2); padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; z-index:1}
table.data td{padding:7px 12px; border-bottom:1px solid var(--line); white-space:nowrap; max-width:280px; overflow:hidden; text-overflow:ellipsis}
table.data td.n{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
table.data td.null{color:var(--ink-3); font-style:italic}
table.data tr:hover td{background:color-mix(in srgb, var(--accent) 5%, transparent)}
.tbl{max-height:460px; overflow:auto; border:1px solid var(--line); border-radius:10px}

/* columns */
.colgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.col{padding:18px 20px; scroll-margin-top:90px}
.col.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.col-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.col-head h3{font:600 15px var(--f-mono); letter-spacing:0; overflow-wrap:anywhere}
.statgrid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px 12px; margin-bottom:12px}
.statgrid div{display:flex; flex-direction:column; min-width:0}
.statgrid span{font:500 10.5px var(--f-mono); color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em}
.statgrid b{font:500 13.5px var(--f-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.topvals{display:flex; flex-direction:column; gap:6px}
.topvals .r{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 54px; gap:10px; align-items:center; font-size:13px}
.topvals .r span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.track{height:8px; background:var(--sunk); border-radius:99px; overflow:hidden}
.track i{display:block; height:100%; background:var(--tc, var(--accent)); border-radius:99px}
.topvals .p{font:500 12px var(--f-mono); color:var(--ink-3); text-align:right}
.hist rect{fill:var(--tc, var(--accent)); opacity:.85}

/* query */
.editor{overflow:hidden}
.editor textarea{display:block; width:100%; min-height:150px; border:0; outline:0; resize:vertical; padding:16px 18px; background:transparent;
  font:400 14.5px/1.6 var(--f-mono); color:var(--ink); tab-size:2}
.ebar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; background:var(--sunk); border-top:1px solid var(--line)}
.kbd{font:500 11px var(--f-mono); padding:1px 5px; border:1px solid var(--line); border-radius:4px; color:var(--ink-3); background:var(--surface)}
.examples{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.examples button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 12px; font-size:13px; cursor:pointer; color:var(--ink-2)}
.examples button:hover{border-color:var(--accent); color:var(--ink)}
.plan{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:14px 0 12px; font:500 12px var(--f-mono)}
.plan .st{padding:5px 9px; border-radius:8px; background:var(--sunk); color:var(--ink-2)}
.plan .st b{color:var(--ink)}
.plan .arr{color:var(--ink-3)}
.qerr{padding:14px 16px; border-radius:10px; background:var(--neg-soft); font:400 13.5px/1.5 var(--f-mono); margin-top:14px; white-space:pre-wrap}
.qerr b{font-family:var(--f-ui)}

/* charts */
.ctrls{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:16px}
.caption{font-size:14px; color:var(--ink-2); margin:0 0 10px}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2); margin-top:8px}
.legend i{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:5px}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--paper); padding:7px 10px; border-radius:8px; font:500 12px var(--f-mono); transform:translate(-50%,calc(-100% - 10px)); white-space:nowrap; z-index:5}
.cwrap{position:relative}

/* predict */
.psetup{display:grid; grid-template-columns:minmax(0,260px) minmax(0,1fr); gap:20px}
.feats{display:flex; flex-wrap:wrap; gap:6px; max-height:170px; overflow:auto}
.feats label{display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:5px 10px 5px 8px; border-radius:999px; border:1px solid var(--line); cursor:pointer; background:var(--surface)}
.feats label:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.feats input{accent-color:var(--accent); margin:0}
.task{display:inline-flex; align-items:center; gap:6px; font:600 12px var(--f-mono); padding:5px 10px; border-radius:8px; background:var(--accent-soft); color:var(--accent)}
.metrics{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px}
.metric{padding:12px 14px; border-radius:12px; background:var(--sunk)}
.metric span{display:block; font:500 10.5px var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.metric b{display:block; font:700 24px/1.2 var(--f-ui); margin-top:4px}
.metric small{font-size:12px; color:var(--ink-3)}
.cm{border-collapse:collapse; font:500 13px var(--f-mono)}
.cm th{font-weight:500; color:var(--ink-3); padding:6px 10px; text-align:center; font-size:11.5px}
.cm td{width:64px; height:44px; text-align:center; border-radius:6px; border:3px solid var(--surface)}
.imp .r{display:grid; grid-template-columns:minmax(0,130px) minmax(0,1fr) 46px; gap:10px; align-items:center; font-size:13px; margin-bottom:7px}
.imp .r span:first-child{font-family:var(--f-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.whatif{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:16px}
.whatif .inp,.whatif .sel{width:100%}
.probs .r{display:grid; grid-template-columns:minmax(0,110px) minmax(0,1fr) 54px; gap:10px; align-items:center; font-size:14px; margin-bottom:8px}
.probs .track{height:12px}
.bigpred{font:700 34px/1.1 var(--f-ui); letter-spacing:-.02em}
.epoch{font:500 12px var(--f-mono); color:var(--ink-3)}

.toast{position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); opacity:0; pointer-events:none;
  background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:12px; font-size:14px; box-shadow:var(--shadow); transition:opacity .2s, transform .2s; z-index:60; max-width:calc(100vw - 32px)}
.toast.show{opacity:1; transform:translate(-50%,0)}
.mfoot{display:none}

@media (max-width:1150px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .built{grid-template-columns:repeat(2,minmax(0,1fr))} .ctrls{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:980px){ .grid2,.hero,.psetup{grid-template-columns:minmax(0,1fr)} .colgrid{grid-template-columns:minmax(0,1fr)} .samples{grid-template-columns:minmax(0,1fr)} .metrics{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr); background:none}
  .rail{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; height:auto; flex-direction:row; align-items:center; justify-content:space-between; gap:10px; overflow:visible;
    padding-block:11px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--rail)}
  .brand svg{width:30px; height:30px} .brand b{font-size:20px} .brand small{display:none}
  .dscard{display:none}
  .rail-foot{margin:0; flex-direction:row} .rail-foot .credit-line{display:none}
  .tabs{position:fixed; left:0; right:0; bottom:0; z-index:40; flex-direction:row; justify-content:space-around; background:var(--rail); gap:0;
    padding-top:6px; padding-bottom:calc(6px + env(safe-area-inset-bottom,0px)); padding-left:max(4px, env(safe-area-inset-left,0px)); padding-right:max(4px, env(safe-area-inset-right,0px))}
  .tab{flex-direction:column; gap:3px; font-size:10.5px; padding:6px 2px; flex:1; justify-content:center; text-align:center}
  .main{padding-block:22px 110px}
  .mfoot{display:block; text-align:center; font-size:12.5px; color:var(--ink-3); margin-top:36px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ctrls{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .built{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){ .tab .tl{font-size:10px} .metrics{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .kpi b{font-size:23px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }

<script>
/* ======================================================================
   Quarry core: CSV parsing, type inference and profiling.
   Written as one factory so the same code runs inside a Web Worker
   (built from this function's source) and on the main thread as a fallback.
   ====================================================================== */
function QuarryCore(S){
  var MISSING = { '':1, 'na':1, 'n/a':1, 'null':1, 'nan':1, 'none':1, '-':1, '?':1, '#n/a':1 };
  var NUM_RE = /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;
  var DATE_RE = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/;
  var BOOLS = { 'true':1, 'false':1, 'yes':1, 'no':1, 'y':1, 'n':1 };

  S.detectDelimiter = function(text){
    var lines = text.slice(0, 20000).split(/\r?\n/).filter(function(l){ return l.trim(); }).slice(0, 12);
    var best = ',', bestScore = -1;
    [',', ';', '\t', '|'].forEach(function(d){
      var counts = lines.map(function(l){ var c = 0, q = false; for (var i = 0; i < l.length; i++){ if (l[i] === '"') q = !q; else if (!q && l[i] === d) c++; } return c; });
      if (!counts.length || counts[0] === 0) return;
      var same = counts.filter(function(c){ return c === counts[0]; }).length / counts.length;
      var score = counts[0] * (same > .8 ? 10 : 1);
      if (score > bestScore){ bestScore = score; best = d; }
    });
    return best;
  };

  S.parseCSV = function(text, d){
    var rows = [], row = [], f = '', q = false, i = text.charCodeAt(0) === 0xFEFF ? 1 : 0, n = text.length, start = i;
    for (; i < n; i++){
      var c = text[i];
      if (q){
        if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"' && f === ''){ q = true; }
      else if (c === d){ row.push(f); f = ''; }
      else if (c === '\n' || c === '\r'){
        row.push(f); f = '';
        if (c === '\r' && text[i+1] === '\n') i++;
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else f += c;
    }

  function parseDate(s){

  function quantile(sorted, p){
    if (!sorted.length) return null;

  S.profile = function(ds){
    var t0 = Date.now(), n = ds.n;

}

<script>
(() => {

  if (v === null || v === undefined || Number.isNaN(v)) return '';

}
const pad = n => String(n).padStart(2, '0');
function fmtDate(ms, time){

/* ---------------- theme ---------------- */

/* ---------------- sample data (deterministic, synthetic) ---------------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const SAMPLES = {
  heart: { title: 'Heart health screening', desc: 'Community screening results across seven districts. Predict which patients are at high cardiovascular risk.', tags: ['1,200 rows', '12 columns', 'Classification'],
    make(){

      const districts = ['Gasabo','Kicukiro','Nyarugenge','Musanze','Huye','Rubavu','Rwamagana'], start = Date.UTC(2025, 10, 1);

  coffee: { title: 'Kigali café sales', desc: 'Six months of orders from four branches. Explore busy hours, best sellers and how people pay.', tags: ['1,800 rows', '10 columns', 'Time series'],
    make(){
      const r = rng(21), rows = [['order_date','hour','branch','product','quantity','unit_price_rwf','total_rwf','payment','temperature_c','loyalty_member']];
      const prices = { Espresso:1500, Cappuccino:2500, Latte:2800, 'African tea':1200, Mandazi:500, 'Passion juice':2000 };

    make(){

/* ---------------- loading pipeline (Web Worker with fallback) ---------------- */
let worker = null;
try {
  const src = '(' + QuarryCore.toString() + ')(self);self.onmessage=function(e){try{var ds=self.buildDataset(e.data.text,e.data.name);var pr=self.profile(ds);self.postMessage({ok:true,ds:ds,prof:pr})}catch(err){self.postMessage({ok:false,error:String(err&&err.message||err)})}}';

function runLocal(text, name){ const ds = Core.buildDataset(text, name); return { ok: true, ds, prof: Core.profile(ds), local: true }; }
function process(text, name){
  return new Promise(resolve => {
    if (!worker){ try { resolve(runLocal(text, name)); } catch(e){ resolve({ ok: false, error: e.message }); } return; }
    let done = false;
    const fallback = () => { if (done) return; done = true; try { resolve(runLocal(text, name)); } catch(e){ resolve({ ok: false, error: e.message }); } };
    worker.onmessage = e => { if (done) return; done = true; resolve(e.data); };
    worker.onerror = ev => { ev.preventDefault && ev.preventDefault(); worker = null; fallback(); };

  });
}
async function loadText(text, name, source, sampleId, stay){

  state.loading = false;
  if (!res.ok){ state.loadError = res.error; if (currentView() === 'open') renderOpen(); else location.hash = 'open'; return false; }
  state.ds = res.ds; state.prof = res.prof; state.source = source; state.sampleId = sampleId || null; state.onWorker = !res.local;
  state.totalMs = Math.max(1, Math.round(performance.now() - t0)); state.bytes = text.length;
  state.colMap = new Map(state.ds.cols.map(c => [c.key, c]));
  state.query = null; state.chart = null; state.model = null; state.qResult = null;
  if (sampleId) ls.set('quarry.sample', sampleId);

}

}

/* ---------------- router ---------------- */

function findings(){
  const { ds, prof } = state, out = [];
  const corrs = [];
  prof.corrCols.forEach((a, i) => prof.corrCols.forEach((b, j) => { if (j > i && prof.corr[i][j] !== null) corrs.push([a, b, prof.corr[i][j]]); }));
  corrs.sort((x, y) => Math.abs(y[2]) - Math.abs(x[2]));
  corrs.filter(c => Math.abs(c[2]) >= .3).slice(0, 3).forEach(([a, b, r]) => out.push({ k: 'info', i: 'r', t: `${cref(a)} and ${cref(b)} move ${r > 0 ? 'together' : 'in opposite directions'} (r = ${r.toFixed(2)}, ${Math.abs(r) >= .6 ? 'strong' : 'moderate'}).` }));
  // categorical target hints: numeric means that differ most across a binary column
  ds.cols.forEach((c, ci) => {
    const p = prof.cols[ci];
    if (!(c.type === 'boolean' || c.type === 'category') || p.unique !== 2) return;
    const [l1, l2] = p.top.map(t => t[0]); let best = null;
    ds.cols.forEach((nc, ni) => {
      if (!isNumT(nc.type) || prof.cols[ni].isId || !prof.cols[ni].sd) return;
      let s1 = 0, n1 = 0, s2 = 0, n2 = 0;
      for (let r = 0; r < ds.n; r++){ const v = nc.values[r], g = c.values[r]; if (v === null) continue; if (g === l1){ s1 += v; n1++; } else if (g === l2){ s2 += v; n2++; } }
      if (n1 < 10 || n2 < 10) return;
      const d = (s1 / n1 - s2 / n2) / prof.cols[ni].sd;
      if (!best || Math.abs(d) > Math.abs(best.d)) best = { d, col: nc.name, m1: s1 / n1, m2: s2 / n2 };
    });
    if (best && Math.abs(best.d) > .5) out.push({ k: 'info', i: '≠', t: `Rows where ${cref(c.name)} is <b>${esc(l1)}</b> average ${fmtNum(best.m1)} for ${cref(best.col)}, against ${fmtNum(best.m2)} when it is <b>${esc(l2)}</b>.` });
  });
  prof.cols.forEach(p => {
    const pct = p.missing / ds.n * 100;
    if (pct >= 1) out.push({ k: 'warn', i: '!', t: `${cref(p.name)} is missing ${pct.toFixed(1)}% of values (${fmtInt(p.missing)} rows). Quarry fills these with the median when training.` });
  });
  prof.cols.forEach(p => {
    if (p.type !== 'date' && p.outliers && p.outliers / p.count > .005) out.push({ k: 'warn', i: '↕', t: `${cref(p.name)} has ${fmtInt(p.outliers)} outliers outside ${fmtNum(p.outLo)} to ${fmtNum(p.outHi)} (1.5 × IQR rule).` });
  });
  prof.cols.forEach(p => { if (isNumT(p.type) && !p.isId && Math.abs(p.skew) > 1) out.push({ k: 'info', i: '~', t: `${cref(p.name)} is ${p.skew > 0 ? 'right' : 'left'}-skewed (skew ${p.skew.toFixed(2)}). The median (${fmtNum(p.median)}) describes it better than the mean (${fmtNum(p.mean)}).` }); });
  prof.cols.forEach(p => { if (p.top && p.unique > 2 && p.topShare > .5 && !p.isId) out.push({ k: 'info', i: '%', t: `<b>${esc(p.top[0][0])}</b> makes up ${(p.topShare * 100).toFixed(0)}% of ${cref(p.name)}.` }); });
  prof.cols.forEach(p => { if (p.isId) out.push({ k: 'good', i: '#', t: `${cref(p.name)} is unique on every row, so it looks like an identifier. Quarry leaves it out of models.` }); });
  if (prof.duplicates) out.push({ k: 'warn', i: '=', t: `${fmtInt(prof.duplicates)} rows are exact duplicates of an earlier row.` });
  else out.push({ k: 'good', i: '✓', t: 'No duplicate rows.' });
  return out;
}

      <div class="card panel"><h2>Correlation matrix</h2><p class="hint">Pearson correlation between numeric columns. Orange moves together, blue moves apart.</p><div class="scroll-x">${corrMatrix()}</div></div>
    </div>

      <div class="tbl">${tableHTML(ds.cols.map(c => ({ name: c.name, col: c })), Array.from({ length: Math.min(25, ds.n) }, (_, r) => ds.cols.map(c => c.values[r])))}</div></div>`;
  bindColrefs();

function corrMatrix(){
  const { prof } = state, names = prof.corrCols, k = names.length;
  if (k < 2) return '<p class="muted">Needs at least two numeric columns.</p>';
  const cs = 38, L = Math.min(130, 12 + Math.max(...names.map(n => n.length)) * 6.6), T = 8, W = L + k * cs + 70, H = T + k * cs + Math.min(110, 12 + Math.max(...names.map(n => n.length)) * 6.4);
  let s = '';
  for (let i = 0; i < k; i++) for (let j = 0; j < k; j++){
    const r = prof.corr[i][j], x = L + j * cs, y = T + i * cs;
    const col = r === null ? 'var(--sunk)' : `color-mix(in srgb, ${r >= 0 ? 'var(--c1)' : 'var(--c2)'} ${Math.round(Math.abs(r) * 85 + 4)}%, var(--surface))`;
    s += `<rect x="${x}" y="${y}" width="${cs - 3}" height="${cs - 3}" rx="5" style="fill:${col}"><title>${esc(names[i])} × ${esc(names[j])}: ${r === null ? 'n/a' : r.toFixed(3)}</title></rect>`;
    if (r !== null) s += `<text class="v" x="${x + (cs - 3) / 2}" y="${y + cs / 2 + 2}" text-anchor="middle" style="fill:${Math.abs(r) > .55 ? 'var(--surface)' : 'var(--ink-2)'}">${i === j ? '1' : r.toFixed(2).replace('0.', '.')}</text>`;
  }
  names.forEach((n, i) => {
    const sn = n.length > 18 ? n.slice(0, 17) + '…' : n;
    s += `<text class="lbl" x="${L - 8}" y="${T + i * cs + cs / 2 + 2}" text-anchor="end">${esc(sn)}</text>`;
    s += `<text class="lbl" transform="translate(${L + i * cs + cs / 2 - 1},${T + k * cs + 6}) rotate(40)">${esc(sn)}</text>`;
  });
  return `<svg class="chart corr" viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto;display:block;min-width:${Math.min(W, 340)}px" role="img" aria-label="Correlation matrix">${s}</svg>`;
}
function tableHTML(heads, rows){
  const numc = heads.map((h, i) => !(h.col && h.col.type === 'date') && rows.some(r => typeof r[i] === 'number') && rows.every(r => r[i] === null || r[i] === undefined || typeof r[i] === 'number'));
  return `<table class="data"><thead><tr>${heads.map((h, i) => `<th${numc[i] ? ' style="text-align:right"' : ''}>${esc(h.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((v, i) => {
    if (v === null || v === undefined) return '<td class="null">null</td>';
    const num = typeof v === 'number' && !(heads[i].col && heads[i].col.type === 'date');
    return `<td class="${num ? 'n' : ''}">${esc(fmtVal(v, heads[i].col))}</td>`;
  }).join('')}</tr>`).join('')}</tbody></table>`;
}

    const keyed = out.map(r => ({ r, k: q.order.map(o => ev(o.e, Object.assign({}, r.ctx, { preferAlias: true }))) }));

  if (q.limit !== null){ out = out.slice(0, q.limit); stages.push(['Limit', out.length]); }
  const heads = items.map(it => ({ name: it.alias || it.text, col: outCol(it) }));
  return { heads, rows: out.map(r => r.vals), stages, ms: performance.now() - t0 };
}

/* ================= QUERY VIEW ================= */
function exampleQueries(){
  const { ds, prof } = state;
  if (state.sampleId === 'heart') return [
    ['Risk by district', "SELECT district, COUNT(*) AS patients,\n  ROUND(AVG(risk = 'high') * 100, 1) AS pct_high_risk,\n  ROUND(AVG(systolic_bp), 1) AS avg_bp\nFROM data\nGROUP BY district\nORDER BY pct_high_risk DESC"],
    ['Smokers vs non-smokers', "SELECT smoker, activity_level, COUNT(*) AS n,\n  ROUND(AVG(risk = 'high') * 100, 1) AS pct_high_risk\nFROM data\nGROUP BY smoker, activity_level\nORDER BY pct_high_risk DESC"],
    ['Age bands', "SELECT CASE WHEN age < 35 THEN '18-34' WHEN age < 50 THEN '35-49'\n  WHEN age < 65 THEN '50-64' ELSE '65+' END AS age_band,\n  COUNT(*) AS patients, ROUND(AVG(cholesterol), 0) AS avg_chol\nFROM data\nGROUP BY age_band\nORDER BY age_band"],
    ['Urgent follow-ups', "SELECT patient_id, age, systolic_bp, cholesterol, glucose\nFROM data\nWHERE systolic_bp >= 160 AND (glucose > 140 OR smoker = 'yes')\nORDER BY systolic_bp DESC\nLIMIT 20"]
  ];
  if (state.sampleId === 'coffee') return [
    ['Revenue by branch', "SELECT branch, COUNT(*) AS orders,\n  SUM(total_rwf) AS revenue_rwf,\n  ROUND(AVG(total_rwf), 0) AS avg_ticket\nFROM data\nGROUP BY branch\nORDER BY revenue_rwf DESC"],
    ['Busiest hours', "SELECT hour, COUNT(*) AS orders\nFROM data\nGROUP BY hour\nORDER BY hour"],
    ['Monthly trend', "SELECT MONTH(order_date) AS month, SUM(total_rwf) AS revenue_rwf\nFROM data\nGROUP BY month\nORDER BY month"],
    ['Hot-day drinks', "SELECT product, COUNT(*) AS orders\nFROM data\nWHERE temperature_c > 25\nGROUP BY product\nORDER BY orders DESC"]
  ];
  if (state.sampleId === 'students') return [
    ['Scores by programme', "SELECT programme, COUNT(*) AS students,\n  ROUND(AVG(final_score), 1) AS avg_score,\n  MEDIAN(final_score) AS median_score\nFROM data\nGROUP BY programme\nORDER BY avg_score DESC"],
    ['Sleep and scores', "SELECT ROUND(sleep_hours) AS sleep, COUNT(*) AS students,\n  ROUND(AVG(final_score), 1) AS avg_score\nFROM data\nGROUP BY sleep\nORDER BY sleep"],
    ['Jobs and study time', "SELECT part_time_job, ROUND(AVG(study_hours_week), 1) AS study_hrs,\n  ROUND(AVG(final_score), 1) AS avg_score\nFROM data\nGROUP BY part_time_job"],
    ['Top performers', "SELECT student_id, programme, final_score\nFROM data\nWHERE attendance_pct >= 90\nORDER BY final_score DESC\nLIMIT 10"]
  ];
  const q = c => /^[A-Za-z_][A-Za-z0-9_]*$/.test(c.name) ? c.name : `"${c.name}"`;
  const cat = ds.cols.find((c, i) => (c.type === 'category' || c.type === 'boolean') && !prof.cols[i].isId);
  const nm = ds.cols.find((c, i) => isNumT(c.type) && !prof.cols[i].isId);
  const ex = [['First rows', 'SELECT *\nFROM data\nLIMIT 50']];
  if (cat) ex.push(['Count by ' + cat.name, `SELECT ${q(cat)}, COUNT(*) AS n\nFROM data\nGROUP BY ${q(cat)}\nORDER BY n DESC`]);
  if (cat && nm) ex.push([`Average ${nm.name}`, `SELECT ${q(cat)}, ROUND(AVG(${q(nm)}), 2) AS avg_${nm.key.replace(/\W+/g, '_')}\nFROM data\nGROUP BY ${q(cat)}\nORDER BY 2 DESC`.replace('ORDER BY 2 DESC', `ORDER BY avg_${nm.key.replace(/\W+/g, '_')} DESC`)]);
  if (nm) ex.push([`Top ${nm.name}`, `SELECT *\nFROM data\nORDER BY ${q(nm)} DESC\nLIMIT 10`]);

}

function runQuery(){

    out.innerHTML = `<div class="qerr"><b>${esc(e instanceof SQLError ? e.message : 'Something went wrong running this query: ' + e.message)}</b>${esc(where)}</div>`;

}
function autoChart(r){
  if (r.rows.length < 2 || r.rows.length > 40 || r.heads.length < 2 || !r.stages.some(s => s[0] === 'Group')) return '';
  const li = r.heads.findIndex((h, i) => r.rows.every(row => typeof row[i] === 'string' || typeof row[i] === 'number'));
  const vi = r.heads.findIndex((h, i) => i !== li && r.rows.every(row => typeof row[i] === 'number' || row[i] === null) && !(h.col && h.col.type === 'date'));
  if (li < 0 || vi < 0) return '';
  const labels = r.rows.map(row => fmtVal(row[li], r.heads[li].col)), vals = r.rows.map(row => row[vi] ?? 0);
  return `<div class="card panel" style="margin-top:16px"><h2>${esc(r.heads[vi].name)} by ${esc(r.heads[li].name)}</h2><p class="hint">Drawn automatically from the result.</p>${barChart(labels, vals, { yLabel: r.heads[vi].name })}</div>`;
}

/* ================= CHART PRIMITIVES ================= */
function niceTicks(min, max, count = 5){
  if (min === max){ min -= 1; max += 1; }
  const span = max - min, step0 = Math.pow(10, Math.floor(Math.log10(span / count))), err = span / count / step0;
  const step = step0 * (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}
const shortNum = v => { const a = Math.abs(v); return a >= 1e9 ? (v / 1e9).toFixed(1).replace(/\.0$/, '') + 'B' : a >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : a >= 1e4 ? (v / 1e3).toFixed(0) + 'k' : fmtNum(v); };

  if (yLabel) s += `<text x="${L}" y="${T - 6}" class="lbl">${esc(yLabel)}</text>`;
  return s;
}
function barChart(labels, vals, o = {}){
  const n = labels.length, W = 760, H = 320, maxLab = Math.max(...labels.map(l => String(l).length)), rot = n > 8 || maxLab * n * 6.5 > 640;
  const L = 58, R = 12, T = 22, B = rot ? Math.min(110, 20 + maxLab * 5.6) : 30;
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), yt = niceTicks(lo, hi), y0 = yt[0], y1 = yt[yt.length - 1];
  const y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B), bw = (W - L - R) / n;
  let s = frame(W, H, L, R, T, B, yt, y, o.yLabel);
  labels.forEach((l, i) => {
    const v = vals[i], x = L + i * bw + bw * .14, w = bw * .72, top = y(Math.max(0, v)), h = Math.abs(y(v) - y(0));
    s += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="${Math.min(5, w / 4).toFixed(1)}" style="fill:${v < 0 ? 'var(--neg)' : 'var(--c1)'}"><title>${esc(l)}: ${fmtNum(v)}</title></rect>`;
    const sl = String(l).length > 22 ? String(l).slice(0, 21) + '…' : l;
    s += rot ? `<text transform="translate(${(x + w / 2 + 3).toFixed(1)},${H - B + 12}) rotate(-40)" text-anchor="end" class="lbl">${esc(sl)}</text>` : `<text x="${(x + w / 2).toFixed(1)}" y="${H - B + 16}" text-anchor="middle" class="lbl">${esc(sl)}</text>`;
    if (n <= 14) s += `<text x="${(x + w / 2).toFixed(1)}" y="${(v >= 0 ? top - 5 : top + h + 12).toFixed(1)}" text-anchor="middle">${shortNum(v)}</text>`;
  });
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  return `<div class="scroll-x"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="display:block;min-width:${Math.min(760, Math.max(360, n * 26))}px" role="img">${s}</svg></div>`;
}
function lineChart(pts, o = {}){
  const W = 760, H = 320, L = 58, R = 16, T = 22, B = 34;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), yt = niceTicks(Math.min(0, ...ys), Math.max(...ys)), y0 = yt[0], y1 = yt[yt.length - 1];
  const x = v => L + (x1 === x0 ? .5 : (v - x0) / (x1 - x0)) * (W - L - R), y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = frame(W, H, L, R, T, B, yt, y, o.yLabel);
  const nt = Math.min(6, pts.length);
  for (let i = 0; i < nt; i++){ const p = pts[Math.round(i * (pts.length - 1) / Math.max(1, nt - 1))]; s += `<text x="${x(p[0])}" y="${H - 12}" text-anchor="${i === 0 && nt > 1 ? 'start' : i === nt - 1 && nt > 1 ? 'end' : 'middle'}" class="lbl">${esc(o.fmtX ? o.fmtX(p[0]) : fmtNum(p[0]))}</text>`; }

  return `<div class="scroll-x"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="display:block;min-width:420px" role="img">${s}</svg></div>`;
}
function scatterChart(pts, o = {}){
  const W = 760, H = 380, L = 58, R = 16, T = 22, B = 40;
  const xt = niceTicks(Math.min(...pts.map(p => p[0])), Math.max(...pts.map(p => p[0]))), yt = niceTicks(Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[1])));

}

function aggregate(vals, how){

}
function buildChart(C){

  const yLabel = Y ? `${aggName} ${Y.name}` : 'Rows';

    const unit = spanDays > 400 ? 'month' : spanDays > 120 ? 'week' : 'day';
    const keyOf = ms => { const d = new Date(ms); if (unit === 'month') return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1); if (unit === 'week'){ const w = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); return w - ((d.getUTCDay() + 6) % 7) * 864e5; } return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
    const g = new Map();
    for (let i = 0; i < n; i++){ if (X.values[i] === null) continue; const k = keyOf(X.values[i]); if (!g.has(k)) g.set(k, []); if (Y){ if (Y.values[i] !== null) g.get(k).push(Y.values[i]); } else g.get(k).push(1); }
    const pts = [...g].map(([k, v]) => [k, Y ? aggregate(v, C.agg) : v.length]).filter(r => r[1] !== null).sort((a, b) => a[0] - b[0]);
    const fx = unit === 'month' ? (ms => new Date(ms).toLocaleDateString('en-GB', { month:'short', year:'2-digit', timeZone:'UTC' })) : (ms => new Date(ms).toLocaleDateString('en-GB', { day:'numeric', month:'short', timeZone:'UTC' }));
    return `<p class="caption">${esc(yLabel)} per ${unit} of <b>${esc(X.name)}</b>.</p>` + lineChart(pts, { yLabel, fmtX: fx });
  }
  if (isNumT(X.type) && !Y){
    const p = state.prof.cols[ds.cols.indexOf(X)];
    const labels = p.hist.map((_, i) => fmtNum(p.min + i * p.histStep));
    return `<p class="caption">Distribution of <b>${esc(X.name)}</b> (${p.hist.length} bins). Pick a Y column to compare two numbers.</p>` + barChart(labels, p.hist, { yLabel: 'Rows' });
  }
  if (isNumT(X.type) && Y){
    const Cc = C.color ? state.colMap.get(C.color.toLowerCase()) : null;
    const levels = Cc ? [...new Set(Cc.values.filter(v => v !== null))].slice(0, 6) : [];
    const colorOf = v => Cc ? `var(--c${levels.indexOf(v) + 1})` : null;
    let idx = []; for (let i = 0; i < n; i++) if (X.values[i] !== null && Y.values[i] !== null) idx.push(i);
    const total = idx.length; if (idx.length > 2500){ const r = rng(5); idx = idx.filter(() => r() < 2500 / total); }
    let sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0; const m = total;
    for (let i = 0; i < n; i++){ const a = X.values[i], b = Y.values[i]; if (a === null || b === null) continue; sx += a; sy += b; sxx += a * a; sxy += a * b; syy += b * b; }
    const slope = (sxy - sx * sy / m) / (sxx - sx * sx / m), icpt = (sy - slope * sx) / m, rr = (sxy - sx * sy / m) / Math.sqrt((sxx - sx * sx / m) * (syy - sy * sy / m));
    const pts = idx.map(i => [X.values[i], Y.values[i], colorOf(Cc ? Cc.values[i] : null)]);
    return `<p class="caption"><b>${esc(Y.name)}</b> against <b>${esc(X.name)}</b>: ${fmtInt(total)} points${total > 2500 ? ', 2,500 sampled for drawing' : ''}. Trend line slope ${fmtNum(slope)}, r = ${isFinite(rr) ? rr.toFixed(2) : 'n/a'}.</p>`
      + scatterChart(pts, { yLabel: Y.name, xLabel: X.name, fit: isFinite(slope) ? [icpt, slope] : null })
      + (Cc ? `<div class="legend">${levels.map((l, i) => `<span><i style="background:var(--c${i + 1})"></i>${esc(Cc.name)} = ${esc(l)}</span>`).join('')}</div>` : '');
  }
  return '<p class="muted">This column type cannot be charted on the X axis.</p>';
}

/* ================= PREDICT (from-scratch ML) ================= */
function modelCandidates(){
  const { ds, prof } = state;
  return ds.cols.map((c, i) => ({ c, p: prof.cols[i] })).filter(x => !x.p.isId && x.c.type !== 'text' && x.c.type !== 'date' && x.p.unique >= 2);
}
function renderPredict(){
  const cands = modelCandidates();
  if (!cands.length){ $('#view').innerHTML = `<header class="vhead"><div><h1>Predict</h1></div></header><div class="card panel"><p class="muted">This dataset has no columns that can be predicted. Quarry needs numeric or categorical columns.</p></div>`; return; }
  if (!state.pcfg){ state.pcfg = {}; }
  const key = state.ds.name + state.ds.n;
  if (state.pcfg.key !== key){
    const tgt = cands.slice().reverse().find(x => (x.c.type === 'category' || x.c.type === 'boolean') && x.p.unique <= 10) || cands[cands.length - 1];
    let target = state.sampleId === 'students' ? 'final_score' : state.sampleId === 'coffee' ? 'product' : tgt.c.name;
    state.pcfg = { key, target, feats: null };
  }
  const P = state.pcfg;
  const targetCol = state.colMap.get(P.target.toLowerCase());
  const tp = state.prof.cols[state.ds.cols.indexOf(targetCol)];
  const task = isNumT(targetCol.type) && tp.unique > 10 ? 'regression' : 'classification';
  const featOpts = cands.filter(x => x.c.name !== P.target && !(x.c.type === 'category' && x.p.unique > 30));
  if (!P.feats) P.feats = featOpts.filter(x => !(state.sampleId === 'coffee' && ['total_rwf','unit_price_rwf'].includes(x.c.name))).map(x => x.c.name);
  P.feats = P.feats.filter(f => featOpts.some(x => x.c.name === f));
  $('#view').innerHTML = `
    <header class="vhead"><div><span class="eyebrow">Machine learning, from scratch</span><h1>Predict</h1>
      <p>Pick a column to predict. Quarry encodes the features, splits the rows 80/20, trains with gradient descent (Adam) and scores the model on rows it never saw.</p></div></header>
    <div class="card panel" style="margin-bottom:18px">
      <div class="psetup">
        <div style="display:flex;flex-direction:column;gap:12px">
          <label class="field">Column to predict<select class="sel" id="ptarget">${cands.map(x => `<option ${x.c.name === P.target ? 'selected' : ''}>${esc(x.c.name)}</option>`).join('')}</select></label>
          <div><span class="task">${task === 'regression' ? 'Regression · linear model' : `Classification · ${tp.unique} classes · softmax`}</span></div>
          <button class="btn primary" id="train" type="button">Train model</button>
          <span class="epoch" id="epoch"></span>
        </div>
        <div style="min-width:0"><div class="field" style="margin-bottom:8px">Features used (${P.feats.length} of ${featOpts.length})</div>
          <div class="feats">${featOpts.map(x => `<label><input type="checkbox" value="${esc(x.c.name)}" ${P.feats.includes(x.c.name) ? 'checked' : ''}>${esc(x.c.name)} <span class="type ${x.c.type}" style="padding:2px 5px;font-size:9.5px">${x.c.type === 'integer' || x.c.type === 'number' ? 'num' : x.c.type === 'boolean' ? 'bool' : 'cat'}</span></label>`).join('')}</div>
        </div>
      </div>
    </div>
    <div id="pout"></div>`;
  $('#ptarget').addEventListener('change', e => { P.target = e.target.value; P.feats = null; state.model = null; renderPredict(); });
  $$('.feats input').forEach(cb => cb.addEventListener('change', () => { P.feats = $$('.feats input').filter(x => x.checked).map(x => x.value); $('.psetup .field').textContent = `Features used (${P.feats.length} of ${featOpts.length})`; }));
  $('#train').addEventListener('click', () => train(task));
  if (state.model && state.model.target === P.target) showModel(state.model); else train(task);
}
function buildMatrix(task){
  const { ds } = state, P = state.pcfg, T = state.colMap.get(P.target.toLowerCase());
  const feats = P.feats.map(f => state.colMap.get(f.toLowerCase()));
  const rows = []; for (let i = 0; i < ds.n; i++) if (T.values[i] !== null) rows.push(i);
  const enc = feats.map(c => {
    if (isNumT(c.type)){
      const v = rows.map(i => c.values[i]).filter(x => x !== null).sort((a, b) => a - b);
      const med = v.length ? v[Math.floor(v.length / 2)] : 0, mean = v.reduce((s, x) => s + x, 0) / (v.length || 1);
      const sd = Math.sqrt(v.reduce((s, x) => s + (x - mean) ** 2, 0) / (v.length || 1)) || 1;
      return { c, kind: 'num', med, mean, sd, dims: 1, min: v[0], max: v[v.length - 1] };
    }
    const counts = new Map(); rows.forEach(i => { const v = c.values[i]; if (v !== null) counts.set(v, (counts.get(v) || 0) + 1); });
    const levels = [...counts].sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => x[0]);
    return { c, kind: 'cat', levels, dims: levels.length, mode: levels[0] };
  });
  const D = enc.reduce((s, e) => s + e.dims, 0);
  const encode = get => { const x = new Float64Array(D + 1); let o = 0; enc.forEach((e, fi) => { const v = get(e.c, fi); if (e.kind === 'num'){ x[o] = ((v === null ? e.med : v) - e.mean) / e.sd; o++; } else { const li = e.levels.indexOf(v); if (li >= 0) x[o + li] = 1; o += e.dims; } }); x[D] = 1; return x; };
  const X = rows.map(i => encode(c => c.values[i]));
  let classes = null, Y, ymean = 0, ysd = 1;
  if (task === 'classification'){
    const cnt = new Map(); rows.forEach(i => cnt.set(T.values[i], (cnt.get(T.values[i]) || 0) + 1));
    classes = [...cnt].sort((a, b) => b[1] - a[1]).map(x => x[0]);
    if (classes.length > 12) throw new Error(`"${T.name}" has ${classes.length} distinct values. Pick a column with 12 or fewer to classify.`);
    Y = rows.map(i => classes.indexOf(T.values[i]));
  } else {
    const v = rows.map(i => T.values[i]); ymean = v.reduce((s, x) => s + x, 0) / v.length; ysd = Math.sqrt(v.reduce((s, x) => s + (x - ymean) ** 2, 0) / v.length) || 1;
    Y = v.map(x => (x - ymean) / ysd);
  }
  const r = rng(42), order = rows.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const cut = Math.floor(order.length * .8);
  return { enc, D, encode, X, Y, classes, ymean, ysd, trainIdx: order.slice(0, cut), testIdx: order.slice(cut), target: T };
}
function train(task){
  const out = $('#pout'), P = state.pcfg;
  if (!P.feats.length){ out.innerHTML = '<div class="card panel"><p class="muted">Select at least one feature to train on.</p></div>'; return; }
  let M;
  try { M = buildMatrix(task); } catch(e){ out.innerHTML = `<div class="qerr"><b>${esc(e.message)}</b></div>`; return; }
  const K = task === 'classification' ? M.classes.length : 1, D1 = M.D + 1;
  const W = Array.from({ length: K }, () => new Float64Array(D1)), mW = W.map(() => new Float64Array(D1)), vW = W.map(() => new Float64Array(D1));
  const lr = .05, b1 = .9, b2 = .999, eps = 1e-8, l2 = 1e-3, EPOCHS = 300, PER_FRAME = 6;
  const losses = [], tr = M.trainIdx, N = tr.length;
  const forward = x => { if (K === 1){ let s = 0; for (let d = 0; d < D1; d++) s += W[0][d] * x[d]; return [s]; } const z = W.map(w => { let s = 0; for (let d = 0; d < D1; d++) s += w[d] * x[d]; return s; }); const mx = Math.max(...z); const e = z.map(v => Math.exp(v - mx)); const se = e.reduce((a, b) => a + b, 0); return e.map(v => v / se); };
  let epoch = 0, t = 0;
  out.innerHTML = `<div class="grid2"><div class="card panel"><h2>Training</h2><p class="hint">${task === 'classification' ? 'Cross-entropy' : 'Mean squared error'} on the ${fmtInt(N)} training rows, ${EPOCHS} epochs.</p><div id="lossC"></div></div><div class="card panel" id="mpanel"><h2>Results</h2><p class="hint">Appear when training finishes.</p><div class="loading"><span class="spin"></span>Training…</div></div></div>`;
  $('#train').disabled = true;
  const step = () => {
    for (let s = 0; s < PER_FRAME && epoch < EPOCHS; s++, epoch++){
      const G = W.map(() => new Float64Array(D1)); let loss = 0;
      for (const i of tr){
        const x = M.X[i], p = forward(x);
        if (K === 1){ const err = p[0] - M.Y[i]; loss += err * err; for (let d = 0; d < D1; d++) G[0][d] += 2 * err * x[d]; }
        else { loss -= Math.log(Math.max(1e-12, p[M.Y[i]])); for (let k = 0; k < K; k++){ const g = p[k] - (k === M.Y[i] ? 1 : 0); if (g) for (let d = 0; d < D1; d++) G[k][d] += g * x[d]; } }
      }
      t++;
      for (let k = 0; k < K; k++) for (let d = 0; d < D1; d++){
        const g = G[k][d] / N + (d < M.D ? l2 * W[k][d] : 0);
        mW[k][d] = b1 * mW[k][d] + (1 - b1) * g; vW[k][d] = b2 * vW[k][d] + (1 - b2) * g * g;
        W[k][d] -= lr * (mW[k][d] / (1 - b1 ** t)) / (Math.sqrt(vW[k][d] / (1 - b2 ** t)) + eps);
      }
      losses.push(loss / N);
    }
    const lc = $('#lossC'); if (!lc){ state.trainTimer = null; return; }
    lc.innerHTML = lineChart(losses.map((l, i) => [i + 1, l]), { yLabel: 'Loss', fmtX: v => 'epoch ' + v });
    const ep = $('#epoch'); if (ep) ep.textContent = `Epoch ${epoch} of ${EPOCHS} · loss ${losses[losses.length - 1].toFixed(4)}`;
    if (epoch < EPOCHS) state.trainTimer = requestAnimationFrame(step);
    else { state.trainTimer = null; $('#train').disabled = false; state.model = finish(M, W, forward, task, losses); showModel(state.model, true); }
  };
  state.trainTimer = requestAnimationFrame(step);
}
function finish(M, W, forward, task, losses){
  const te = M.testIdx, model = { task, target: M.target.name, M, W, forward, losses };
  if (task === 'classification'){
    const K = M.classes.length, cm = Array.from({ length: K }, () => Array(K).fill(0));
    const scores = [];
    te.forEach(i => { const p = forward(M.X[i]); const pred = p.indexOf(Math.max(...p)); cm[M.Y[i]][pred]++; scores.push([p[1] ?? 0, M.Y[i] === 1 ? 1 : 0]); });
    const acc = cm.reduce((s, r, i) => s + r[i], 0) / te.length;
    const base = Math.max(...M.classes.map((_, k) => te.filter(i => M.Y[i] === k).length)) / te.length;
    let auc = null;
    if (K === 2){ const pos = scores.filter(s => s[1]), neg = scores.filter(s => !s[1]); if (pos.length && neg.length){ let w = 0; const sorted = scores.slice().sort((a, b) => a[0] - b[0]); let rank = 0, rsum = 0; for (let i = 0; i < sorted.length;){ let j = i; while (j < sorted.length && sorted[j][0] === sorted[i][0]) j++; const avgR = (i + j + 1) / 2; for (let q = i; q < j; q++) if (sorted[q][1]) rsum += avgR; i = j; } auc = (rsum - pos.length * (pos.length + 1) / 2) / (pos.length * neg.length); } }
    const f1s = M.classes.map((_, k) => { const tp = cm[k][k], fp = cm.reduce((s, r, i) => s + (i !== k ? r[k] : 0), 0), fn = cm[k].reduce((s, v, j) => s + (j !== k ? v : 0), 0); const pr = tp + fp ? tp / (tp + fp) : 0, rc = tp + fn ? tp / (tp + fn) : 0; return pr + rc ? 2 * pr * rc / (pr + rc) : 0; });
    Object.assign(model, { cm, acc, base, auc, macroF1: f1s.reduce((s, v) => s + v, 0) / K });
  } else {
    const pairs = te.map(i => [M.Y[i] * M.ysd + M.ymean, forward(M.X[i])[0] * M.ysd + M.ymean]);
    const mean = pairs.reduce((s, p) => s + p[0], 0) / pairs.length;
    const ssr = pairs.reduce((s, p) => s + (p[0] - p[1]) ** 2, 0), sst = pairs.reduce((s, p) => s + (p[0] - mean) ** 2, 0);
    const trainMean = M.trainIdx.reduce((s, i) => s + M.Y[i], 0) / M.trainIdx.length * M.ysd + M.ymean;
    Object.assign(model, { pairs, r2: 1 - ssr / sst, mae: pairs.reduce((s, p) => s + Math.abs(p[0] - p[1]), 0) / pairs.length, rmse: Math.sqrt(ssr / pairs.length), baseMae: pairs.reduce((s, p) => s + Math.abs(p[0] - trainMean), 0) / pairs.length });
  }
  let o = 0; const imp = M.enc.map(e => { let s = 0; for (let d = o; d < o + e.dims; d++) for (const w of W) s += Math.abs(w[d]); o += e.dims; return [e.c.name, s / (e.kind === 'cat' ? Math.sqrt(e.dims) : 1)]; });
  const tot = imp.reduce((s, x) => s + x[1], 0) || 1;
  model.importance = imp.map(([n, v]) => [n, v / tot]).sort((a, b) => b[1] - a[1]);
  return model;
}
function showModel(m, fresh){
  const out = $('#pout'); if (!out) return;
  const M = m.M, pct = v => (v * 100).toFixed(1) + '%';
  let metrics, detail;
  if (m.task === 'classification'){
    metrics = `<div class="metric"><span>Accuracy</span><b>${pct(m.acc)}</b><small>on ${fmtInt(M.testIdx.length)} test rows</small></div>
      <div class="metric"><span>Baseline</span><b>${pct(m.base)}</b><small>always guessing the most common class</small></div>
      <div class="metric"><span>${m.auc !== null ? 'ROC AUC' : 'Macro F1'}</span><b>${m.auc !== null ? m.auc.toFixed(3) : m.macroF1.toFixed(3)}</b><small>${m.auc !== null ? `ranking quality for "${esc(M.classes[1])}"` : 'balanced across classes'}</small></div>
      <div class="metric"><span>Lift</span><b style="color:${m.acc > m.base ? 'var(--pos)' : 'var(--neg)'}">${m.acc >= m.base ? '+' : '−'}${Math.abs((m.acc - m.base) * 100).toFixed(1)} pts</b><small>over the baseline</small></div>`;
    const K = M.classes.length, mx = Math.max(...m.cm.flat(), 1);
    detail = `<h2 style="font-size:15px;margin:4px 0 10px">Confusion matrix</h2><div class="scroll-x"><table class="cm"><tr><th></th>${M.classes.map(c => `<th>pred. ${esc(c)}</th>`).join('')}</tr>${m.cm.map((r, i) => `<tr><th style="text-align:right">actual ${esc(M.classes[i])}</th>${r.map((v, j) => `<td style="background:color-mix(in srgb, ${i === j ? 'var(--pos)' : 'var(--neg)'} ${Math.round(v / mx * 70 + (v ? 8 : 0))}%, var(--sunk));color:${v / mx > .55 ? 'var(--surface)' : 'var(--ink)'}">${v}</td>`).join('')}</tr>`).join('')}</table></div>`;
  } else {
    metrics = `<div class="metric"><span>R²</span><b>${m.r2.toFixed(3)}</b><small>share of variance explained</small></div>
      <div class="metric"><span>MAE</span><b>${fmtNum(m.mae)}</b><small>average miss, in ${esc(m.target)} units</small></div>
      <div class="metric"><span>RMSE</span><b>${fmtNum(m.rmse)}</b><small>penalises big misses</small></div>
      <div class="metric"><span>Baseline MAE</span><b>${fmtNum(m.baseMae)}</b><small>always predicting the mean</small></div>`;
    detail = `<h2 style="font-size:15px;margin:4px 0 10px">Predicted vs actual</h2>${scatterChart(m.pairs.map(p => [p[0], p[1]]), { xLabel: 'actual', yLabel: 'predicted', diag: true })}`;
  }
  out.innerHTML = `
    <div class="grid2">
      <div class="card panel"><h2>Training</h2><p class="hint">Loss fell from ${m.losses[0].toFixed(3)} to ${m.losses[m.losses.length - 1].toFixed(3)} over ${m.losses.length} epochs.</p>${lineChart(m.losses.map((l, i) => [i + 1, l]), { yLabel: 'Loss', fmtX: v => 'epoch ' + v })}</div>
      <div class="card panel"><h2>Results on unseen rows</h2><p class="hint">Scored on the 20% of rows held out from training.</p><div class="metrics" style="grid-template-columns:repeat(2,minmax(0,1fr))">${metrics}</div>${detail}</div>
    </div>
    <div class="grid2">
      <div class="card panel"><h2>Try a prediction</h2><p class="hint">Change the inputs and the model answers instantly.</p><div class="whatif" id="whatif">${M.enc.map((e, i) => e.kind === 'num'
        ? `<label class="field">${esc(e.c.name)}<input class="inp" type="number" step="any" data-i="${i}" value="${+(+e.med).toFixed(2)}"></label>`
        : `<label class="field">${esc(e.c.name)}<select class="sel" data-i="${i}">${e.levels.map(l => `<option ${l === e.mode ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`).join('')}</div><div id="predOut"></div></div>
      <div class="card panel"><h2>What drives the prediction</h2><p class="hint">Share of the model's weight on each feature (standardised).</p><div class="imp">${m.importance.map(([n, v]) => `<div class="r"><span title="${esc(n)}">${esc(n)}</span><span class="track"><i style="width:${(v / m.importance[0][1] * 100).toFixed(1)}%"></i></span><span class="mono" style="font-size:12px;color:var(--ink-3);text-align:right">${(v * 100).toFixed(0)}%</span></div>`).join('')}</div></div>
    </div>`;
  const ep = $('#epoch'); if (ep) ep.textContent = `Trained ${m.losses.length} epochs on ${fmtInt(M.trainIdx.length)} rows`;
  const predict = () => {
    const vals = {}; $$('#whatif [data-i]').forEach(el => { const e = M.enc[+el.dataset.i]; vals[+el.dataset.i] = e.kind === 'num' ? (el.value === '' ? null : +el.value) : el.value; });
    const x = M.encode((c, fi) => vals[fi] ?? null), p = m.forward(x);
    if (m.task === 'regression'){ $('#predOut').innerHTML = `<span class="eyebrow">Predicted ${esc(m.target)}</span><div class="bigpred num">${fmtNum(p[0] * M.ysd + M.ymean)}</div><p class="muted">Typical error on unseen rows: ± ${fmtNum(m.mae)}</p>`; return; }
    const best = p.indexOf(Math.max(...p));
    $('#predOut').innerHTML = `<span class="eyebrow">Predicted ${esc(m.target)}</span><div class="bigpred" style="margin-bottom:12px">${esc(M.classes[best])}</div><div class="probs">${M.classes.map((c, k) => `<div class="r"><span>${esc(c)}</span><span class="track"><i style="width:${(p[k] * 100).toFixed(1)}%;background:${k === best ? 'var(--accent)' : 'var(--ink-3)'}"></i></span><span class="mono" style="text-align:right;font-size:13px">${(p[k] * 100).toFixed(1)}%</span></div>`).join('')}</div>`;
  };
  $$('#whatif [data-i]').forEach(el => el.addEventListener('input', predict));
  predict();
  if (fresh) toast(m.task === 'classification' ? `Model trained: ${(m.acc * 100).toFixed(1)}% accuracy on unseen rows` : `Model trained: R² ${m.r2.toFixed(2)} on unseen rows`);
}

/* ---------------- boot ---------------- */
renderRail();
const startSample = SAMPLES[ls.get('quarry.sample')] ? ls.get('quarry.sample') : 'heart';
loadSample(startSample, true);
})();
